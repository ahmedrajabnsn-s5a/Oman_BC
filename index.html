<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SKYFive Oman BC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--fg:#eef1fb;--muted:rgba(222,228,248,.66);--faint:rgba(222,228,248,.4);--edge:rgba(255,255,255,.09);--edge-strong:rgba(255,255,255,.18);
  --primary:#6f8dff;--primary-2:#9a7bff;--neg:#ff7a8e;--logo-word:#fff;--logo-word-2:#c7cff8;--logo-bar-1:#ff5a62;--logo-bar-2:#c00000;
  --ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(60% 55% at 50% 46%,#10152b,#03040a 75%);color:var(--fg);font-family:Manrope,Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.amb{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.amb .au{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0deg,rgba(56,86,255,.32) 50deg,transparent 110deg,rgba(128,80,255,.24) 190deg,transparent 250deg,rgba(255,70,80,.12) 310deg,transparent 360deg);filter:blur(110px);opacity:.55;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.amb .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(111,141,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(111,141,255,.06) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(55% 50% at 50% 50%,#000,transparent 80%);-webkit-mask-image:radial-gradient(55% 50% at 50% 50%,#000,transparent 80%)}
.amb .ring{position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;border:1px solid rgba(111,141,255,.12);animation:pulse 5s var(--ease) infinite}
.amb .ring.r2{animation-delay:2.5s}
@keyframes pulse{0%{transform:scale(.55);opacity:0}30%{opacity:1}100%{transform:scale(1.35);opacity:0}}
canvas#pt{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
#stage{position:relative;z-index:1;height:100%;display:grid;place-items:center;align-content:center;gap:26px;padding:16px;transition:transform 1s var(--ease),opacity .9s var(--ease),filter .9s var(--ease)}
#stage.leave{transform:scale(1.08);opacity:0;filter:blur(14px)}
.logo{display:block;width:min(380px,74vw);height:auto;aspect-ratio:600/319;overflow:visible;transition:transform 1s var(--ease)}
.logo .bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:barRise .65s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(.8s + var(--b) * .1s)}
.logo .bars{filter:drop-shadow(0 0 6px rgba(255,70,80,.6))}
.logo .cloud{clip-path:inset(0 100% 0 0);animation:draw 1.1s var(--ease) .1s forwards}
.logo .word{opacity:0;animation:wordIn .9s var(--ease) .35s forwards}
.logo .shine{animation:shine 6s ease-in-out infinite;animation-delay:2.2s}
@keyframes draw{to{clip-path:inset(0 0 0 0)}}
@keyframes wordIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@keyframes barRise{to{transform:scaleY(1)}}
@keyframes shine{0%,70%{transform:translateX(-260px)}100%{transform:translateX(760px)}}
.ready .logo .bar{animation:sig 6s var(--ease) infinite;animation-delay:calc(var(--b) * 90ms);transform:scaleY(1)}
@keyframes sig{0%,82%,100%{transform:scaleY(1)}87%{transform:scaleY(.2)}94%{transform:scaleY(1.1)}}
.tag{font-family:Sora,Manrope,sans-serif;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);opacity:0;animation:wordIn .8s var(--ease) 1.2s forwards;text-align:center}
form{width:min(400px,100%);opacity:0;transform:translateY(18px);filter:blur(6px);animation:formIn .9s var(--ease) 1.7s forwards}
@keyframes formIn{to{opacity:1;transform:none;filter:none}}
.field{position:relative;cursor:text;display:flex;align-items:center;gap:10px;padding:7px 7px 7px 18px;border-radius:18px;background:rgba(14,18,36,.6);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 22px 50px -22px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .3s,box-shadow .4s var(--ease)}
@keyframes flow{to{background-position:-250% 0}}
.field:focus-within{border-color:rgba(255,90,98,.5);box-shadow:0 0 0 4px rgba(255,90,98,.14),0 22px 50px -22px rgba(0,0,0,.85)}
.field svg.lock{width:18px;height:18px;flex:none;color:var(--muted)}
input{position:relative;z-index:1;font-size:16px;flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 16px Manrope,sans-serif;letter-spacing:.06em;padding:10px 0}
input::placeholder{color:var(--faint);letter-spacing:.02em}
.eye{position:relative;z-index:1;background:none;border:0;color:var(--faint);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.eye:hover{color:var(--fg)} .eye svg{width:18px;height:18px}
button.go{position:relative;z-index:1;flex:none;width:46px;height:46px;border-radius:13px;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,#ff6b72 0%,#ff3b47 45%,#c00000 100%);box-shadow:0 8px 24px -8px rgba(255,64,76,.75),0 0 18px -6px rgba(255,64,76,.5);transition:transform .25s var(--ease),filter .25s}
button.go:hover{transform:translateX(2px);filter:brightness(1.12)} button.go:active{transform:scale(.94)}
button.go svg{width:20px;height:20px}
button.go .sp{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.busy button.go svg{display:none} .busy button.go .sp{display:block}
.msg{min-height:20px;margin-top:12px;text-align:center;font-size:13px;color:var(--faint);transition:color .3s}
.err .field{border-color:rgba(255,122,142,.6);box-shadow:0 0 0 4px rgba(255,122,142,.14);animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.err .msg{color:var(--neg)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.ok .field{border-color:rgba(69,217,160,.6);box-shadow:0 0 0 5px rgba(69,217,160,.14),0 0 40px rgba(69,217,160,.25)}
.ok .msg{color:#45d9a0}
.foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);opacity:0;animation:wordIn 1s var(--ease) 2.2s forwards}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){#stage{gap:20px;align-content:start;padding-top:18vh}.tag{font-size:11px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
